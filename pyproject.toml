[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "us-trace-desk"
version = "1.0.0"
description = "USM Back-to-Birth Trace Exception-Audit Desk for Aviation Parts Dealers"
readme = "README.md"
authors = [{ name = "Robert Ketler", email = "managerytacc81@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "reportlab>=3.6.0",
    "pypdf>=3.0.0",
    "requests>=2.28.0",
    "dnspython>=2.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
trace-desk = "trace_desk.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
